<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Log</title>

<style>
  :root {
    --bg: #2b2d31; --surface: #313338; --card: #383a40; --accent: #e8555a;
    --accent2: #9b6dd7; --gold: #e0a82e; --text: #e0e0e0; --muted: #999;
    --green: #57d9a3; --teal: #4ecdc4; --border: #44464d;
    --shadow: 0 2px 6px rgba(0,0,0,0.2);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.65;
  }

  /* Top bar */
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 20px; position: sticky; top: 0; z-index: 100;
    box-shadow: var(--shadow);
  }
  .back-link {
    color: var(--muted); text-decoration: none; font-size: 0.9em;
    display: flex; align-items: center; gap: 6px; transition: color 0.2s;
  }
  .back-link:hover { color: var(--text); }
  .page-title { font-weight: 700; font-size: 1.1em; color: #fff; }

  /* Pill toggle */
  .pill-toggle {
    display: flex; background: var(--card); border-radius: 24px;
    padding: 3px; gap: 2px;
  }
  .pill-btn {
    padding: 8px 20px; border: none; border-radius: 20px;
    background: transparent; color: var(--muted); font-family: inherit;
    font-size: 0.88em; font-weight: 600; cursor: pointer; transition: all 0.25s;
  }
  .pill-btn.active-tepi { background: var(--accent2); color: #fff; }
  .pill-btn.active-guaimei { background: var(--gold); color: #1a1a1a; }

  /* Main content */
  .main { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }

  /* Stats cards */
  .stats-row {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; text-align: center;
    box-shadow: var(--shadow);
  }
  .stat-value { font-size: 1.6em; font-weight: 800; margin-bottom: 2px; }
  .stat-label { font-size: 0.78em; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-sub { font-size: 0.72em; color: var(--muted); margin-top: 4px; }
  .stat-card.words .stat-value { color: var(--teal); }
  .stat-card.books .stat-value { color: var(--green); }
  .stat-card.year .stat-value { color: var(--accent2); }
  .stat-card.rereads .stat-value { color: var(--gold); }

  /* Progress bar */
  .progress-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .progress-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .progress-title { font-weight: 600; font-size: 0.95em; }
  .progress-pct { color: var(--teal); font-weight: 700; font-size: 1.1em; }
  .progress-track {
    height: 14px; background: var(--card); border-radius: 7px;
    overflow: hidden; position: relative;
  }
  .progress-fill {
    height: 100%; border-radius: 7px; transition: width 0.8s ease;
    background: linear-gradient(90deg, #4ecdc4, #57d9a3);
  }
  .progress-detail {
    display: flex; justify-content: space-between;
    font-size: 0.78em; color: var(--muted); margin-top: 6px;
  }

  /* Add book form */
  .add-form-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .add-form-card h3 {
    font-size: 1em; margin-bottom: 14px; color: #fff;
    display: flex; align-items: center; gap: 8px;
  }
  .form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .form-group { display: flex; flex-direction: column; flex: 1; min-width: 120px; }
  .form-group label { font-size: 0.78em; color: var(--muted); margin-bottom: 4px; }
  .form-group input[type="text"],
  .form-group input[type="number"] {
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; color: var(--text); font-family: inherit; font-size: 0.9em;
    outline: none; transition: border-color 0.2s;
  }
  .form-group input:focus { border-color: var(--teal); }
  .checkbox-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
  }
  .checkbox-row input[type="checkbox"] {
    accent-color: var(--gold); width: 18px; height: 18px; cursor: pointer;
  }
  .checkbox-row label { font-size: 0.88em; cursor: pointer; }
  .btn-add {
    background: linear-gradient(135deg, var(--teal), var(--green));
    color: #1a1a1a; border: none; border-radius: 8px; padding: 10px 28px;
    font-family: inherit; font-size: 0.9em; font-weight: 700;
    cursor: pointer; transition: opacity 0.2s;
  }
  .btn-add:hover { opacity: 0.85; }

  /* Year group */
  .year-group { margin-bottom: 28px; }
  .year-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 2px solid var(--border); margin-bottom: 8px;
  }
  .year-header h3 { font-size: 1.05em; color: #fff; }
  .year-header .year-stats { font-size: 0.82em; color: var(--muted); }
  .year-header .year-stats span { margin-left: 12px; }

  /* Book table */
  .book-table { width: 100%; border-collapse: collapse; }
  .book-table th {
    text-align: left; font-size: 0.75em; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 10px;
    border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
  }
  .book-table th:hover { color: var(--text); }
  .book-table th.sortable::after { content: ' \u2195'; font-size: 0.85em; }
  .book-table td {
    padding: 10px; border-bottom: 1px solid rgba(68,70,77,0.4);
    font-size: 0.9em; vertical-align: middle;
  }
  .book-table tr:hover { background: rgba(78,205,196,0.04); }
  .book-title { font-weight: 500; }
  .reread-badge {
    display: inline-flex; align-items: center; gap: 4px;
    background: rgba(224,168,46,0.15); color: var(--gold);
    padding: 2px 8px; border-radius: 10px; font-size: 0.8em; font-weight: 600;
  }
  .notes-text { font-size: 0.82em; color: var(--muted); }
  .word-col { font-variant-numeric: tabular-nums; }
  .word-col.editable { cursor: pointer; color: var(--teal); }
  .word-col.editable:hover { text-decoration: underline; }
  .source-badge {
    display: inline-block; font-size: 0.7em; padding: 1px 6px;
    border-radius: 6px; background: rgba(155,109,215,0.15); color: var(--accent2);
    margin-left: 6px; font-weight: 600;
  }

  /* Favorites section */
  .favorites-section { margin-top: 36px; }
  .favorites-section h2 {
    font-size: 1.15em; margin-bottom: 16px; color: #fff;
    display: flex; align-items: center; gap: 8px;
  }
  .favorites-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 12px;
  }
  .fav-card {
    background: var(--surface); border: 1px solid var(--border);
    border-left: 4px solid var(--gold); border-radius: 12px;
    padding: 16px; box-shadow: var(--shadow);
  }
  .fav-card .fav-title { font-weight: 600; margin-bottom: 4px; }
  .fav-card .fav-meta { font-size: 0.82em; color: var(--muted); }
  .fav-card .fav-year { font-size: 0.78em; color: var(--gold); margin-top: 6px; }

  /* Collapsible year headers */
  .year-header.collapsible { cursor: pointer; }
  .year-header.collapsible:hover { background: rgba(78,205,196,0.04); border-radius: 6px; }
  .year-chevron { display: inline-block; width: 16px; font-size: 0.8em; color: var(--muted); transition: transform 0.2s; }

  /* Analysis section */
  .analysis-section { margin-top: 40px; padding-top: 32px; border-top: 2px solid var(--border); }
  .analysis-section h2 { font-size: 1.15em; color: #fff; margin-bottom: 20px; }
  .analysis-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); }
  .analysis-card h3 { font-size: 0.95em; color: var(--teal); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .volume-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 0.88em; }
  .volume-bar .year-label { min-width: 90px; color: var(--muted); }
  .volume-bar .bar-track { flex: 1; height: 8px; background: var(--card); border-radius: 4px; overflow: hidden; }
  .volume-bar .bar-fill { height: 100%; border-radius: 4px; }
  .volume-bar .bar-value { min-width: 80px; text-align: right; color: var(--text); font-weight: 600; font-size: 0.85em; }
  .theme-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; font-size: 0.88em; }
  .theme-row .theme-name { min-width: 140px; }
  .theme-row .theme-bar { flex: 1; max-width: 200px; height: 6px; background: var(--card); border-radius: 3px; overflow: hidden; }
  .theme-row .theme-fill { height: 100%; border-radius: 3px; background: var(--accent2); }
  .theme-row .theme-count { min-width: 40px; color: var(--muted); font-size: 0.85em; }
  .direction-card { background: var(--card); border-left: 3px solid var(--teal); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; font-size: 0.92em; line-height: 1.6; }
  .direction-card .dir-icon { color: var(--teal); margin-right: 8px; }
  .fiction-split { display: flex; gap: 20px; align-items: center; margin-bottom: 8px; }
  .fiction-bar { flex: 1; height: 12px; background: var(--card); border-radius: 6px; overflow: hidden; display: flex; }
  .fiction-fill { height: 100%; }
  .fiction-labels { display: flex; justify-content: space-between; font-size: 0.82em; color: var(--muted); }

  /* Responsive */
  @media (max-width: 640px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .stat-value { font-size: 1.3em; }
    .pill-btn { padding: 7px 14px; font-size: 0.82em; }
    .form-row { flex-direction: column; }
    .book-table { font-size: 0.85em; }
    .book-table th, .book-table td { padding: 8px 6px; }
    .top-bar { flex-wrap: wrap; gap: 8px; }
    .page-title { order: -1; width: 100%; text-align: center; }
    .favorites-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Top bar -->
<div class="top-bar">
  <a href="index.html" class="back-link">&#8592; Home</a>
  <span class="page-title">Reading Log</span>
  <div class="pill-toggle">
    <button class="pill-btn active-tepi" id="btn-tepi" onclick="switchChild('tepi')">TePi</button>
    <button class="pill-btn" id="btn-guaimei" onclick="switchChild('guaimei')">GuaiMei</button>
  </div>
</div>

<div class="main">
  <!-- Stats cards -->
  <div class="stats-row">
    <div class="stat-card words">
      <div class="stat-value" id="stat-total-words">--</div>
      <div class="stat-label">Total Words</div>
      <div class="stat-sub">Lifetime</div>
    </div>
    <div class="stat-card books">
      <div class="stat-value" id="stat-total-books">--</div>
      <div class="stat-label">Books Read</div>
      <div class="stat-sub">Lifetime</div>
    </div>
    <div class="stat-card year">
      <div class="stat-value" id="stat-year-words">--</div>
      <div class="stat-label">This Year</div>
      <div class="stat-sub" id="stat-year-sub">2025-2026</div>
    </div>
    <div class="stat-card rereads">
      <div class="stat-value" id="stat-rereads">--</div>
      <div class="stat-label">Rereads</div>
      <div class="stat-sub">Favorites</div>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="progress-section">
    <div class="progress-header">
      <span class="progress-title">2025-2026 Annual Goal</span>
      <span class="progress-pct" id="progress-pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div class="progress-detail">
      <span id="progress-current">0 words</span>
      <span id="progress-target">Target: 0</span>
    </div>
  </div>

  <!-- Add book form -->
  <div class="add-form-card">
    <h3>+ Add New Book</h3>
    <div class="form-row">
      <div class="form-group" style="flex:3">
        <label>Book Title</label>
        <input type="text" id="input-title" placeholder="Enter book title...">
      </div>
      <div class="form-group" style="flex:1">
        <label>Pages</label>
        <input type="number" id="input-pages" placeholder="0" min="0">
      </div>
      <div class="form-group" style="flex:1">
        <label>Word Count</label>
        <input type="number" id="input-words" placeholder="auto" min="0">
      </div>
      <div class="form-group" style="flex:0.6">
        <label>Multiplier</label>
        <input type="number" id="input-multiplier" placeholder="1" min="1" value="1">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:1">
        <label>Notes</label>
        <input type="text" id="input-notes" placeholder="Series name, difficulty, etc.">
      </div>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="input-reread">
      <label for="input-reread">This is a reread (favorite)</label>
    </div>
    <button class="btn-add" onclick="addBook()">Add Book</button>
  </div>

  <!-- Book list -->
  <div id="book-list"></div>

  <!-- Favorites section -->
  <div id="favorites-section" class="favorites-section"></div>

  <!-- Analysis section -->
  <div id="analysis-section" class="analysis-section"></div>
</div>

}

function getAllBooks(child) {
  const historical = (HISTORICAL_DATA[child] || []).filter(b => !META_TITLES.includes(b.title));
  // Apply any word count edits to historical books
  let edits = [];
  try { edits = JSON.parse(localStorage.getItem("reading_edits_" + child)) || []; } catch(e) {}
  const editMap = {};
  edits.forEach(function(e) { editMap[e.title] = e.words; });
  const patched = historical.map(function(b) {
    if (editMap[b.title] !== undefined) {
      return Object.assign({}, b, { words: editMap[b.title] });
    }
    return b;
  });
  const added = getNewBooks(child);
  return [...patched, ...added];
}

function updateYearTotal(child) {
  const all = getAllBooks(child);
  const yearWords = all.filter(b => b.year === CURRENT_YEAR).reduce((s, b) => s + (b.words || 0), 0);
  localStorage.setItem("reading_total_" + child + "_2025", yearWords.toString());
}

// ── Switch child ──
function switchChild(child) {
  activeChild = child;
  document.getElementById("btn-tepi").className = "pill-btn" + (child === "tepi" ? " active-tepi" : "");
  document.getElementById("btn-guaimei").className = "pill-btn" + (child === "guaimei" ? " active-guaimei" : "");
  render();
}

// ── Edit word count (works for both historical and new books) ──
function editWords(title, currentWords, td) {
  // Replace cell content with an input
  const input = document.createElement("input");
  input.type = "number";
  input.value = currentWords;
  input.style.cssText = "width:100%;background:var(--bg);border:1px solid var(--teal);border-radius:4px;color:var(--teal);padding:4px 8px;font-family:inherit;font-size:0.92em;text-align:right;";
  td.textContent = "";
  td.appendChild(input);
  input.focus();
  input.select();

  function save() {
    const newWords = parseInt(input.value) || 0;
    if (newWords === currentWords) { render(); return; }

    // Try to update in new books first
    const newBooks = getNewBooks(activeChild);
    const idx = newBooks.findIndex(b => b.title === title);
    if (idx >= 0) {
      newBooks[idx].words = newWords;
      saveNewBooks(activeChild, newBooks);
    } else {
      // It's a historical book — save an override in new books
      const hist = (HISTORICAL_DATA[activeChild] || []).find(b => b.title === title);
      if (hist) {
        // Store as an edit entry
        let edits = [];
        try { edits = JSON.parse(localStorage.getItem("reading_edits_" + activeChild)) || []; } catch(e) {}
        const existIdx = edits.findIndex(e => e.title === title);
        if (existIdx >= 0) { edits[existIdx].words = newWords; }
        else { edits.push({ title: title, words: newWords }); }
        localStorage.setItem("reading_edits_" + activeChild, JSON.stringify(edits));
      }
    }
    updateYearTotal(activeChild);
    render();
  }

  input.addEventListener("blur", save);
  input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") { e.preventDefault(); save(); }
    if (e.key === "Escape") { render(); }
  });
}

// ── Add book ──
function addBook() {
  var title = document.getElementById("input-title").value.trim();
  if (!title) return;
  var pages = parseInt(document.getElementById("input-pages").value) || 0;
  var baseWords = parseInt(document.getElementById("input-words").value);
  if (isNaN(baseWords) || baseWords === 0) baseWords = pages * 250;
  var multiplier = parseInt(document.getElementById("input-multiplier").value) || 1;
  var words = baseWords * multiplier;
  var notes = document.getElementById("input-notes").value.trim();
  var reread = document.getElementById("input-reread").checked;

  if (multiplier > 1) {
    notes = (notes ? notes + " | " : "") + multiplier + "x (" + fmtFull(baseWords) + " each)";
  }

  var book = {
    title: title, words: words, pages: pages,
    year: CURRENT_YEAR,
    reread: reread,
    notes: notes,
    date: new Date().toISOString().slice(0, 10),
    source: "manual"
  };

  var books = getNewBooks(activeChild);
  books.push(book);
  saveNewBooks(activeChild, books);
  updateYearTotal(activeChild);

  // Clear form
  document.getElementById("input-title").value = "";
  document.getElementById("input-pages").value = "";
  document.getElementById("input-words").value = "";
  document.getElementById("input-multiplier").value = "1";
  document.getElementById("input-notes").value = "";
  document.getElementById("input-reread").checked = false;

  render();
}

// ── Auto-calc words from pages ──
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("input-pages").addEventListener("input", function() {
    const wordsInput = document.getElementById("input-words");
    if (!wordsInput.value || wordsInput.dataset.auto === "true") {
      wordsInput.value = (parseInt(this.value) || 0) * 250;
      wordsInput.dataset.auto = "true";
    }
  });
  document.getElementById("input-words").addEventListener("input", function() {
    this.dataset.auto = "false";
  });
  render();
});

// ── Render everything ──
function render() {
  const all = getAllBooks(activeChild);
  const target = ANNUAL_TARGETS[activeChild];

  // Stats
  const totalWords = all.reduce((s, b) => s + (b.words || 0), 0);
  const totalBooks = all.length;
  const yearBooks = all.filter(b => b.year === CURRENT_YEAR);
  const yearWords = yearBooks.reduce((s, b) => s + (b.words || 0), 0);
  const rereadCount = all.filter(b => b.reread).length;

  document.getElementById("stat-total-words").textContent = fmt(totalWords);
  document.getElementById("stat-total-books").textContent = totalBooks;
  document.getElementById("stat-year-words").textContent = fmt(yearWords);
  document.getElementById("stat-year-sub").textContent = yearWords.toLocaleString() + " / " + fmt(target);
  document.getElementById("stat-rereads").textContent = rereadCount;

  // Progress bar
  const pct = Math.min(100, (yearWords / target * 100));
  document.getElementById("progress-pct").textContent = pct.toFixed(1) + "%";
  document.getElementById("progress-fill").style.width = pct + "%";
  document.getElementById("progress-current").textContent = fmtFull(yearWords) + " words";
  document.getElementById("progress-target").textContent = "Target: " + fmt(target);

  // Group by year
  const yearMap = {};
  all.forEach(b => {
    if (!yearMap[b.year]) yearMap[b.year] = [];
    yearMap[b.year].push(b);
  });

  // Sort years (most recent first)
  const yearOrder = Object.keys(yearMap).sort((a, b) => {
    const ya = parseInt(a.split("-")[0]);
    const yb = parseInt(b.split("-")[0]);
    return yb - ya;
  });

  // Build book list
  let html = "";
  yearOrder.forEach(year => {
    let books = yearMap[year];
    const yearTotal = books.reduce((s, b) => s + (b.words || 0), 0);
    const yearCount = books.length;

    // Reverse so latest-added books appear first
    books = [...books].reverse();

    // Apply sort if active
    if (sortState.col === "words") {
      books = [...books].sort((a, b) => sortState.asc ? a.words - b.words : b.words - a.words);
    }

    const isCurrent = (year === CURRENT_YEAR);
    const collapseId = 'yr_' + year.replace(/[^a-z0-9]/gi, '');
    html += `<div class="year-group">
      <div class="year-header ${isCurrent ? '' : 'collapsible'}" onclick="${isCurrent ? '' : "toggleYear('" + collapseId + "', this)"}">
        <h3>${isCurrent ? '' : '<span class="year-chevron">\u25B6</span> '}${year}</h3>
        <div class="year-stats">
          <span>${fmtFull(yearTotal)} words</span>
          <span>${yearCount} books</span>
        </div>
      </div>
      <div id="${collapseId}" class="year-body" style="${isCurrent ? '' : 'display:none'}">
      <table class="book-table">
        <thead><tr>
          <th>Title</th>
          <th class="sortable" onclick="toggleSort('words')">Words</th>
          <th>Reread</th>
          <th>Notes</th>
        </tr></thead>
        <tbody>`;

    books.forEach((b, bi) => {
      const rereadHtml = b.reread ? '<span class="reread-badge">&#9733; Fav</span>' : '';
      const sourceHtml = b.source === "planner" ? '<span class="source-badge">planner</span>' : (b.source === "manual" ? '<span class="source-badge">new</span>' : '');
      const editId = 'edit_' + year.replace(/[^a-z0-9]/gi,'') + '_' + bi;
      const canEdit = b.source === "manual" || b.source === "planner";
      html += `<tr>
        <td class="book-title">${escHtml(b.title)}${sourceHtml}</td>
        <td class="word-col editable" onclick="editWords('${escHtml(b.title)}', ${b.words || 0}, this)" title="Click to edit">${fmtFull(b.words || 0)}</td>
        <td>${rereadHtml}</td>
        <td class="notes-text">${escHtml(b.notes || '')}</td>
      </tr>`;
    });

    html += `</tbody></table></div></div>`;
  });

  document.getElementById("book-list").innerHTML = html;

  // Favorites section
  const rereads = all.filter(b => b.reread);
  let favHtml = "";
  if (rereads.length > 0) {
    favHtml = `<h2>&#9733; Favorites &amp; Rereads</h2><div class="favorites-grid">`;
    rereads.forEach(b => {
      favHtml += `<div class="fav-card">
        <div class="fav-title">${escHtml(b.title)}</div>
        <div class="fav-meta">${fmtFull(b.words || 0)} words</div>
        <div class="fav-year">${b.year}${b.notes ? ' &middot; ' + escHtml(b.notes) : ''}</div>
      </div>`;
    });
    favHtml += `</div>`;
  }
  document.getElementById("favorites-section").innerHTML = favHtml;

  // ── Analysis Section ──
  var analysisHtml = '<h2>Reading Analysis</h2>';

  // a) Reading Volume Trend
  var yearVolumes = {};
  all.forEach(function(b) {
    if (!yearVolumes[b.year]) yearVolumes[b.year] = { words: 0, count: 0 };
    yearVolumes[b.year].words += (b.words || 0);
    yearVolumes[b.year].count++;
  });
  var volYears = Object.keys(yearVolumes).sort(function(a, b) {
    return parseInt(a.split("-")[0]) - parseInt(b.split("-")[0]);
  });
  var maxVolume = 0;
  volYears.forEach(function(y) { if (yearVolumes[y].words > maxVolume) maxVolume = yearVolumes[y].words; });

  analysisHtml += '<div class="analysis-card"><h3>Reading Volume Trend</h3>';
  volYears.forEach(function(y) {
    var v = yearVolumes[y];
    var pctW = maxVolume > 0 ? (v.words / maxVolume * 100) : 0;
    var inProgress = (y === CURRENT_YEAR) ? ' (in progress)' : '';
    var barColor = (y === CURRENT_YEAR) ? 'var(--teal)' : 'var(--accent2)';
    analysisHtml += '<div class="volume-bar">' +
      '<span class="year-label">' + y + '</span>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + pctW.toFixed(1) + '%;background:' + barColor + '"></div></div>' +
      '<span class="bar-value">' + fmt(v.words) + ' / ' + v.count + ' books' + inProgress + '</span>' +
      '</div>';
  });
  analysisHtml += '</div>';

  // b) Fiction vs Non-Fiction Balance
  var nfKeywords = ['history', 'math', 'science', 'financial', '101', '102', 'geography', 'biography',
    'hbr', 'marketing', 'brand', 'design', 'tax', 'accounting', 'constitution', 'supreme court',
    'habits', 'startup', 'prisoners', 'non-fiction', 'non-ficton', 'how to', 'geometry', 'atlas',
    'geo bee', 'finance', 'judge bio', 'justics', 'declaration', 'underground railroad',
    'colonist', 'states', 'text book', 'war of worlds', 'daniel boone', 'george washington',
    'healthy foods', 'artificial', 'genetic', 'parthenon', 'solar system', 'space race',
    'no summit', 'chasing space', 'reaching for the moon', 'sam walton', 'art of learning',
    'whack on the side', 'red scarf girl', 'diary of anne frank', 'worth dying'];
  var nfCount = 0, fCount = 0;
  all.forEach(function(b) {
    var lower = (b.title + ' ' + (b.notes || '')).toLowerCase();
    var isNF = false;
    for (var k = 0; k < nfKeywords.length; k++) {
      if (lower.indexOf(nfKeywords[k]) >= 0) { isNF = true; break; }
    }
    if (isNF) nfCount++; else fCount++;
  });
  var totalFNF = fCount + nfCount;
  var fPct = totalFNF > 0 ? (fCount / totalFNF * 100) : 0;
  var nfPct = totalFNF > 0 ? (nfCount / totalFNF * 100) : 0;

  analysisHtml += '<div class="analysis-card"><h3>Fiction vs Non-Fiction Balance</h3>';
  analysisHtml += '<div class="fiction-split">' +
    '<span style="color:var(--accent2);font-weight:600;font-size:0.88em">Fiction ' + fPct.toFixed(0) + '%</span>' +
    '<div class="fiction-bar">' +
    '<div class="fiction-fill" style="width:' + fPct.toFixed(1) + '%;background:var(--accent2)"></div>' +
    '<div class="fiction-fill" style="width:' + nfPct.toFixed(1) + '%;background:var(--teal)"></div>' +
    '</div>' +
    '<span style="color:var(--teal);font-weight:600;font-size:0.88em">Non-Fiction ' + nfPct.toFixed(0) + '%</span>' +
    '</div>';
  analysisHtml += '<div class="fiction-labels"><span>' + fCount + ' books</span><span>' + nfCount + ' books</span></div>';
  analysisHtml += '</div>';

  // c) Reading Preferences (top themes)
  var themes = [
    { name: 'Fantasy/Adventure', keywords: ['percy jackson', 'magnus chase', 'kane chronicles', 'harry potter', 'narnia', 'wings of fire', 'dragon', 'oracles of fire', 'wing feather', 'starlighter', 'prince warriors', 'wingfeather', 'throne of glass', 'course of series', 'house of series', 'demigod', 'trials of apollo', 'hidden oracle', 'inheritance cycle', 'murtagh', 'eragon', 'left behind', 'seven sleepers', 'heroes of olympus', 'hero of olympus', 'pendragon', 'chronicles of the', 'gods and warriors', 'ancient darkness', 'sea of trolls', 'simarilion', 'hobbit', 'swipe', 'voyagers', 'impossible quest', 'razorland', 'shadow king', 'tales of starlight', 'city of ember', 'phantom tollbooth', 'heirs of neverland'], count: 0 },
    { name: 'Historical', keywords: ['history', 'war', 'ancient', 'biography', 'daniel boone', 'george washington', 'behind rebel lines', 'ground zero', 'escape from', 'red scarf girl', 'anne frank', 'revolution is not', 'parthenon', 'genghis', 'worth dying', 'colonist', 'underground railroad', 'declaration'], count: 0 },
    { name: 'Science/Math', keywords: ['math', 'science', 'geometry', 'solar system', 'space race', 'q is for quark', 'artificial', 'genetic', 'music of prime', 'quanta', 'chasing space'], count: 0 },
    { name: 'Business/Life Skills', keywords: ['hbr', 'financial', 'startup', 'habits', 'tax', 'marketing', 'brand', 'accounting', 'finance', 'sam walton', 'art of learning', 'whack on the side', 'design', 'hey whipple', 'non-designer'], count: 0 },
    { name: 'Law/Civics', keywords: ['constitution', 'supreme court', 'justics', 'judge bio', 'rights', 'prisoners of geography', 'geo bee', 'atlas', 'states', 'maps'], count: 0 },
    { name: 'Classic Literature', keywords: ['giver', 'ender', 'life of pi', 'count of monte', 'hunger game', 'series of unfortunate', 'swiss family', 'gulliv', 'peter pan', 'robin hood', 'king arthur', 'aesop', 'esperanza', 'stuart little', 'old yeller', 'where the red fern', 'my side of mountain', 'bridge to', 'walk two moon', 'graveyard book', 'swallows and amazons', 'borrowers', 'island of blue', 'shiloh'], count: 0 }
  ];

  var seriesKeywords = ['series', 'chronicles', 'trilogy', 'saga', '*'];
  var seriesCount = 0;
  var countedSeries = {};
  all.forEach(function(b) {
    var lower = b.title.toLowerCase();
    for (var s = 0; s < seriesKeywords.length; s++) {
      if (lower.indexOf(seriesKeywords[s]) >= 0) {
        if (!countedSeries[lower]) { seriesCount++; countedSeries[lower] = true; }
        break;
      }
    }
  });

  all.forEach(function(b) {
    var lower = (b.title + ' ' + (b.notes || '')).toLowerCase();
    themes.forEach(function(t) {
      for (var k = 0; k < t.keywords.length; k++) {
        if (lower.indexOf(t.keywords[k]) >= 0) { t.count++; break; }
      }
    });
  });

  themes.sort(function(a, b) { return b.count - a.count; });
  var maxTheme = themes.length > 0 ? themes[0].count : 1;

  analysisHtml += '<div class="analysis-card"><h3>Reading Preferences</h3>';
  themes.forEach(function(t) {
    if (t.count === 0) return;
    var tPct = (t.count / maxTheme * 100);
    analysisHtml += '<div class="theme-row">' +
      '<span class="theme-name">' + t.name + '</span>' +
      '<div class="theme-bar"><div class="theme-fill" style="width:' + tPct.toFixed(1) + '%"></div></div>' +
      '<span class="theme-count">' + t.count + '</span>' +
      '</div>';
  });
  analysisHtml += '<div class="theme-row" style="margin-top:8px;">' +
    '<span class="theme-name" style="color:var(--gold)">Series Reader</span>' +
    '<span class="theme-count" style="color:var(--gold)">' + seriesCount + ' series detected</span>' +
    '</div>';
  analysisHtml += '</div>';

  // d) Suggested Reading Directions
  analysisHtml += '<div class="analysis-card"><h3>Suggested Reading Directions</h3>';
  if (activeChild === 'tepi') {
    var tepiDirections = [
      'Strong in fantasy series \u2014 ready for literary fiction crossover (Steinbeck, Hemingway, Bradbury)',
      'Non-fiction growing \u2014 deepen with argument-based essays (Orwell, Hitchens)',
      'Math/science interest emerging \u2014 Quanta Magazine + popular science (Fermat\'s Enigma, The Code Book)',
      'Consider: historical non-fiction to connect with National Affairs reading'
    ];
    tepiDirections.forEach(function(d) {
      analysisHtml += '<div class="direction-card"><span class="dir-icon">\u27A4</span>' + d + '</div>';
    });
  } else {
    var guaimeiDirections = [
      'Exceptional non-fiction appetite \u2014 rare for age. Lean into it.',
      'Law/civics interest is a strength \u2014 expand to landmark case studies',
      'Geography + business combo is unique \u2014 explore economic geography (Why Nations Fail, adapted)',
      'Writing craft: read authors who argue (Hitchens, Orwell) not just report',
      'Design interest + reading = potential for information design projects'
    ];
    guaimeiDirections.forEach(function(d) {
      analysisHtml += '<div class="direction-card"><span class="dir-icon">\u27A4</span>' + d + '</div>';
    });
  }
  analysisHtml += '</div>';

  document.getElementById("analysis-section").innerHTML = analysisHtml;

  // Store year total for planner integration
  updateYearTotal(activeChild);
}

function toggleSort(col) {
  if (sortState.col === col) {
    sortState.asc = !sortState.asc;
  } else {
    sortState.col = col;
    sortState.asc = false;
  }
  render();
}

function escHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function toggleYear(id, header) {
  var el = document.getElementById(id);
  var chevron = header.querySelector('.year-chevron');
  if (el.style.display === 'none') {
    el.style.display = '';
    if (chevron) chevron.textContent = '\u25BC';
  } else {
    el.style.display = 'none';
    if (chevron) chevron.textContent = '\u25B6';
  }
}

// ── Planner integration: exported concept ──
// When the planner logs a book, it calls:
//   window.addBookFromPlanner = function(child, {title, pages, words, date}) { ... }
window.addBookFromPlanner = function(child, data) {
  const book = {
    title: data.title || "Untitled",
    words: data.words || (data.pages || 0) * 250,
    pages: data.pages || 0,
    year: CURRENT_YEAR,
    reread: false,
    notes: "",
    date: data.date || new Date().toISOString().slice(0, 10),
    source: "planner"
  };
  const books = getNewBooks(child);
  books.push(book);
  saveNewBooks(child, books);
  updateYearTotal(child);
  if (child === activeChild) render();
};
